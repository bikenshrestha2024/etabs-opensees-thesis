name: Complete JSON content documentation

on:
  push:
    branches: [main]
    paths:
      - tools/build_json_documentation.py
      - 'archive/previous_versions/**/*.json'
      - 'FILE_MANIFEST_V*.json'
      - 'MANIFEST_V*.json'
      - .github/workflows/json-documentation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse all JSON files and generate complete guides
        run: |
          python tools/build_json_documentation.py
          python tools/build_json_documentation.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: all-json-field-guides
          path: docs/json/
          retention-days: 30
      - name: State documentation review requirement
        run: |
          echo "Generated JSON guides are stored as workflow artifacts only."
          echo "Review provenance and generated schema contents before a separate human-reviewed commit."
