name: Native OpenSees recorder benchmark (conda-forge)
on:
  push:
    branches: [main]
    paths:
      - components/model/linear_shell_stiffness.py
      - tests/verify_linear_shell_stiffness.py
      - tests/native_layered_shell_patch.py
      - tests/native_rigid_arm_patch.py
      - components/model/elastic_conversion_settings.py
      - components/model/assembly.py
      - tests/native_device_recorders.tcl
      - tests/audit_native_device_recorders.py
      - .github/workflows/native-device-recorder.yml
  pull_request:
    paths:
      - components/model/linear_shell_stiffness.py
      - tests/verify_linear_shell_stiffness.py
      - tests/native_layered_shell_patch.py
      - tests/native_rigid_arm_patch.py
      - components/model/elastic_conversion_settings.py
      - components/model/assembly.py
      - .github/workflows/native-device-recorder.yml
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: native-opensees
          create-args: >-
            -c conda-forge
            python=3.12
            opensees
          cache-environment: true
      - name: Native OpenSees FVD and BRB recorder checks
        shell: micromamba-shell {0}
        run: |
          OpenSees tests/native_device_recorders.tcl native_device_results
          python tests/audit_native_device_recorders.py native_device_results
      - name: Archive device recorder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-device-test-evidence
          path: native_device_results/
          if-no-files-found: warn
      - name: Native independent shear elastic shell patches
        shell: micromamba-shell {0}
        run: |
          python -m unittest tests.verify_linear_shell_stiffness
          python -m tests.native_layered_shell_patch native_layered_shell_results
      - name: Archive shell qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-layered-shell-evidence
          path: native_layered_shell_results/
          if-no-files-found: warn
      - name: Native rigid-arm shear-flexible frame qualification
        if: always()
        shell: micromamba-shell {0}
        run: python -m tests.native_rigid_arm_patch native_rigid_arm_results
      - name: Archive rigid-arm qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rigid-arm-evidence
          path: native_rigid_arm_results/
          if-no-files-found: warn
