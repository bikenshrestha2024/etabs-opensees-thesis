name: Literature citation provenance audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'Material_Catalog/**'
      - 'Research_Components/**'
      - 'docs/**'
      - 'engineering/**'
      - 'Calibration_References_V152/**'
      - '*.py'
      - '*.md'
      - 'LITERATURE/tools/**'
      - 'LITERATURE/MASTER_LITERATURE_INDEX.csv'
      - '.github/workflows/literature-citation-audit.yml'

permissions:
  contents: read

concurrency:
  group: literature-audit-main
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'bikenshrestha2024/etabs-opensees-thesis'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Generate source-citation inventory (offline)
        run: python LITERATURE/tools/audit_source_citations.py
      - name: Preserve generated citations for reviewed pull request
        uses: actions/upload-artifact@v4
        with:
          name: literature-citation-review
          path: |
            LITERATURE/CODE_CITATION_OCCURRENCES.csv
            LITERATURE/UNCATALOGUED_DOIS.csv
            LITERATURE/CODE_CITATION_SCAN_SCOPE.json
            LITERATURE/*/CODE_REFERENCES.md
          retention-days: 30
      - name: Report generated-file drift without committing to main
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- LITERATURE/)" ]]; then
            echo "::notice::Citation inventory changed. Review the artifact and commit separately after provenance checks."
          else
            echo "Citation inventory matches tracked source."
          fi
