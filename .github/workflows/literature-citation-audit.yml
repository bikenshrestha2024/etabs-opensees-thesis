name: Literature citation provenance audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'Material_Catalog/**'
      - 'Research_Components/**'
      - 'docs/**'
      - 'engineering/**'
      - 'Calibration_References_V152/**'
      - '*.py'
      - '*.md'
      - 'LITERATURE/tools/**'
      - 'LITERATURE/MASTER_LITERATURE_INDEX.csv'
      - '.github/workflows/literature-citation-audit.yml'

permissions:
  contents: write

concurrency:
  group: literature-audit-main
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'bikenshrestha2024/etabs-opensees-thesis'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Generate source-citation inventory (offline)
        run: python LITERATURE/tools/audit_source_citations.py
      - name: Publish only generated reference indexes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- LITERATURE/CODE_CITATION_OCCURRENCES.csv
          git add -- LITERATURE/UNCATALOGUED_DOIS.csv
          git add -- LITERATURE/CODE_CITATION_SCAN_SCOPE.json
          git add -- 'LITERATURE/*/CODE_REFERENCES.md'
          if ! git diff --cached --quiet; then
            git commit -m "docs(literature): refresh whole-repository citation provenance [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Literature citation inventory already current."
          fi
