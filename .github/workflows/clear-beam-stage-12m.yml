name: Clear-beam source owner and 12m wall reference gates
on:
  push:
    paths:
      - 'tools/REBUILD_VERIFIED_CLEAR_BEAM_MODEL.py'
      - 'components/gravity/gui_and_reports.py'
      - 'components/inputs/project_workbooks.py'
      - 'components/inputs/aw_sources.py'
      - 'components/inputs/model_aligned_reference.py'
      - 'tools/REGISTER_12M_MODEL_REFERENCE.py'
      - 'tests/test_registered_12m_model_reference.py'
      - 'components/inputs/grouped_wall_aw.py'
      - 'tests/test_clear_beam_12m_stage_ownership.py'
      - 'tests/verify_spyder_clear_beam_rebuild.py'
      - 'tests/test_grouped_wall_aw_ubc_seaoc.py'
      - '.github/workflows/clear-beam-stage-12m.yml'
  pull_request:
    paths:
      - 'tools/REBUILD_VERIFIED_CLEAR_BEAM_MODEL.py'
      - 'components/gravity/gui_and_reports.py'
      - 'components/inputs/project_workbooks.py'
      - 'components/inputs/aw_sources.py'
      - 'components/inputs/model_aligned_reference.py'
      - 'tools/REGISTER_12M_MODEL_REFERENCE.py'
      - 'tests/test_registered_12m_model_reference.py'
      - 'components/inputs/grouped_wall_aw.py'
      - 'tests/test_clear_beam_12m_stage_ownership.py'
      - 'tests/verify_spyder_clear_beam_rebuild.py'
      - 'tests/test_grouped_wall_aw_ubc_seaoc.py'
      - '.github/workflows/clear-beam-stage-12m.yml'
jobs:
  stage-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile affected Python
        run: |
          python -m py_compile tools/REBUILD_VERIFIED_CLEAR_BEAM_MODEL.py components/gravity/gui_and_reports.py components/inputs/project_workbooks.py components/inputs/aw_sources.py components/inputs/model_aligned_reference.py tools/REGISTER_12M_MODEL_REFERENCE.py tests/test_clear_beam_12m_stage_ownership.py
      - name: Install minimal workbook/test libraries
        run: python -m pip install --disable-pip-version-check openpyxl numpy matplotlib
      - name: Test new source-owned model stage and fail-closed workbook selection
        run: python -m unittest -v tests.test_clear_beam_12m_stage_ownership tests.test_registered_12m_model_reference tests.verify_spyder_clear_beam_rebuild tests.test_grouped_wall_aw_ubc_seaoc
