name: Gravity single-owner output and duplicate regression
on:
  push:
    paths:
      - 'components/gravity/**'
      - 'components/ui/organized_results.py'
      - 'tests/test_gravity_archive_only_snapshot.py'
      - 'tests/test_gravity_organized_case_index_v172.py'
      - 'tests/test_gravity_workspace_duplicate_audit.py'
      - 'tests/verify_gravity_evidence_workflow.py'
      - 'tests/verify_gravity_case_reaction_registry.py'
      - 'tools/audit_gravity_workspace.py'
      - '.github/workflows/gravity-single-owner.yml'
  pull_request:
    paths:
      - 'components/gravity/**'
      - 'components/ui/organized_results.py'
      - 'tests/test_gravity_archive_only_snapshot.py'
      - 'tests/test_gravity_organized_case_index_v172.py'
      - 'tests/test_gravity_workspace_duplicate_audit.py'
      - 'tests/verify_gravity_evidence_workflow.py'
      - 'tests/verify_gravity_case_reaction_registry.py'
      - 'tools/audit_gravity_workspace.py'
      - '.github/workflows/gravity-single-owner.yml'
jobs:
  stage-gravity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile output owners and report builders
        run: |
          python -m py_compile components/gravity/output_ownership.py components/gravity/reaction_case_registry.py components/gravity/evidence_workflow.py components/gravity/gui_and_reports.py components/gravity/comparison_bundle.py components/gravity/three_case_comparison.py components/ui/organized_results.py tools/audit_gravity_workspace.py
      - name: Install headless report dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib openpyxl
      - name: Verify unique gravity case indexes and source hash guards
        run: |
          python -m unittest -v tests.test_gravity_organized_case_index_v172 tests.verify_gravity_case_reaction_registry
      - name: Verify case evidence paths and immutable ZIP-only archives
        run: |
          python -m unittest -v tests.verify_gravity_evidence_workflow tests.test_gravity_archive_only_snapshot tests.test_gravity_workspace_duplicate_audit tests.verify_primary_32_support_reactions tests.test_gravity_gui_action_layout tests.verify_gravity_node_comparison
