name: Headless pytest suite

# General headless job: installs requirements-ci.txt and runs plain `pytest`
# (pytest.ini: testpaths=tests, test_*.py + verify_*.py).  Tests that need
# tkinter, plotly or the ETABS COM bridge are SKIPPED by conftest.py; any
# assertion failure or other ImportError fails the job.  Native ETABS/Windows
# runs are not covered here.
on:
  pull_request:
    paths: ['*.py', 'components/**', 'src/**', 'tools/**', 'tests/**', 'docs/**', 'LITERATURE/**', 'Saved_Project_V156/**', 'pytest.ini', 'conftest.py', 'requirements-ci.txt', '.github/workflows/tests.yml']
  push:
    branches: [main]
    paths: ['*.py', 'components/**', 'src/**', 'tools/**', 'tests/**', 'docs/**', 'LITERATURE/**', 'Saved_Project_V156/**', 'pytest.ini', 'conftest.py', 'requirements-ci.txt', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/verify_review_ledger.py reads historical commits via git ls-tree
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI requirements
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run headless test suite
        run: python -m pytest -q -ra
