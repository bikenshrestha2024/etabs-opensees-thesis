name: ETABS export staging and display ID regressions
on:
  push:
    branches:
      - "review/**"
      - main
    paths:
      - "components/inputs/gravity_evidence_stage.py"
      - "components/inputs/export_mirror.py"
      - "components/model/display_ids.py"
      - "components/model/id_audit.py"
      - "components/gravity/gui_and_reports.py"
      - "components/gravity/load_path_formulas.py"
      - "components/gravity/mesh_cases.py"
      - "components/model/assembly.py"
      - "components/gravity/load_path_formulas.py"
      - "tests/test_mesh_spatial_performance_regressions.py"
      - "tests/test_area_folder_and_hinged_brace_review.py"
      - "components/sections/area_elements.py"
      - "tests/test_gravity_evidence_stage.py"
      - "tests/test_export_mirror.py"
      - "tests/test_model_mesh_case_workflow.py"
      - "tests/test_slab_mesh_excel_paging.py"
      - "tests/test_display_ids_storey.py"
      - "tests/test_id_audit_display_labels.py"
      - "tests/test_id_audit_roles.py"
      - "tests/test_shared_3d_prefix_selector.py"
      - "tests/test_model_mesh_case_workflow.py"
      - "tests/test_slab_mesh_excel_paging.py"
      - ".github/workflows/export-staging-regressions.yml"
  pull_request:
    paths:
      - "components/inputs/**"
      - "components/model/**"
      - "components/gravity/gui_and_reports.py"
      - "tests/test_*display*.py"
      - "tests/test_area_folder_and_hinged_brace_review.py"
      - "tests/test_model_mesh_case_workflow.py"
      - "tests/test_slab_mesh_excel_paging.py"
      - "components/gravity/load_path_formulas.py"
      - "components/gravity/mesh_cases.py"
      - "tests/test_id_audit_roles.py"
      - "tests/test_gravity_evidence_stage.py"
      - "tests/test_export_mirror.py"
      - ".github/workflows/export-staging-regressions.yml"
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal isolated dependencies
        run: python -m pip install --disable-pip-version-check pytest openpyxl
      - name: Run non-native staging and ID tests
        run: >-
          python -m pytest -q
          tests/test_display_ids_storey.py
          tests/test_id_audit_display_labels.py
          tests/test_id_audit_roles.py
          tests/test_shared_3d_prefix_selector.py
          tests/test_gravity_evidence_stage.py
          tests/test_export_mirror.py
          tests/test_model_mesh_case_workflow.py
          tests/test_slab_mesh_excel_paging.py
          tests/test_mesh_spatial_performance_regressions.py
          tests/test_area_folder_and_hinged_brace_review.py
