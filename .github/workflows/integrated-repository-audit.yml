name: Integrated tracked-tree, dependency and output review

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-inventory:
    name: Full tracked inventory + active AST/import/output gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook regression dependency
        run: python -m pip install openpyxl==3.1.5 numpy pytest==8.4.2
      - name: Enforce engineering first-read guidance and load-purpose contract
        run: python -m unittest -v tests.test_read_first_engineering_contract
      - name: Verify ETABS rigid end-zone source coverage regressions
        run: python -m pytest -q tests/test_elastic_end_offset_source_coverage.py tests/test_elastic_conversion_settings.py
      - name: Verify ETABS source point identity before any shell/frame meshing
        run: python -m unittest -v tests.test_source_node_identity_conversion
      - name: Execute focused audit regression tests
        run: |
          python -m unittest -v tests.test_rayleigh_mass_audit tests.test_rayleigh_saved_evidence_gate tests.test_rayleigh_ledger_audit tests.test_repository_integrated_audit tests.verify_active_repository_audit tests.test_deep_output_inventory_v16 tests.verify_standalone_neutral_model tests.verify_etabs_adapter_boundary tests.test_tracked_review_coverage_v23 tests.test_model_mesh_case_workflow tests.test_output_storage_audit tests.test_organized_results tests.verify_gravity_case_reaction_registry tests.verify_gravity_support_scenarios tests.verify_gravity_validation_scorecard tests.test_gravity_loadpath_evidence_integrity tests.test_active_source_review_bundle tests.test_facade_runtime_context tests.test_solver_numeric_input_contract tests.test_gravity_unique_support_preflight tests.test_modal_mode_count_contract tests.test_export_workflow_roles tests.test_area_folder_and_hinged_brace_review tests.test_gravity_full_source_reactions tests.test_timing_metadata_structure tests.test_gravity_support_topology_evidence tests.test_import01_audit_and_workflow tests.test_id_audit_roles tests.test_unified_output_contract tests.verify_variant_comparison tests.verify_full_record_gate tests.test_first_step_transition tests.test_slab_mesh_excel_paging tests.verify_slab_full_gravity_factors tests.test_esm_organized_export_gui tests.verify_esm_explicit_excel_method tests.verify_nbc105_horizontal_input tests.verify_soil_c_run_matrix
      - name: Inspect tracked tree and active Python, never execute solver/ETABS
        run: |
          python tools/audit_repository_integrated.py --repo . --output audit/integrated --fail-on-static-blockers
      - name: Verify cross-module navigation, duplicate symbols and migration queue
        run: |
          python -m unittest -v tests.test_cross_module_consistency_audit tests.test_source_dependency_edges tests.test_component_readme_catalog tests.test_all_active_output_pair_matrix tests.test_verification_studio_dispatch_contract tests.verify_aw_sources_and_thickness tests.test_gravity_pointwise_failure_gate
          python tools/audit_cross_module_consistency.py --repo . --report-dir audit/integrated/10_MODULE_CONSISTENCY --fail-on-parse --fail-on-shadowed
          python tools/audit_component_readmes.py --root . --output audit/integrated/11_COMPONENT_NAVIGATION/catalog.json --check
          python tools/audit_output_writer_reader_pairs.py --repo . --report-dir audit/integrated/12_MIGRATION_QUEUE --fail-on-parse
      - name: Package tracked active Python source only for deeper review
        run: |
          python tools/build_active_source_review_bundle.py --repo . --output audit/source_review/ACTIVE_PUBLIC_SOURCE_REVIEW.zip
      - name: Preserve code-only source review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: active-public-python-source-review
          path: audit/source_review/ACTIVE_PUBLIC_SOURCE_REVIEW.zip
          if-no-files-found: error
          retention-days: 7
      - name: Preserve per-file register, dependency graph and consolidated findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-repository-static-audit
          path: audit/integrated/
          if-no-files-found: warn
          retention-days: 30
      - name: Explicit validation boundary
        if: always()
        run: |
          echo "Tracked file metadata inventory is NOT a semantic review of every source file."
          echo "Native ETABS, OpenSees, Spyder, full NLTHA and NBC compliance remain NOT_VERIFIED."
