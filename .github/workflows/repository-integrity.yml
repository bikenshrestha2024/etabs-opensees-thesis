name: Repository compilation and navigation

on:
  pull_request:
    paths: ['*.py', 'components/**', 'tools/**', 'tests/**', 'docs/**', 'KNOWLEDGE_BASE/**', '00_READ_FIRST_RUN_ORDER.md', '.github/workflows/repository-integrity.yml']
  push:
    branches: [main]
    paths: ['*.py', 'components/**', 'tools/**', 'tests/**', 'docs/**', 'KNOWLEDGE_BASE/**', '00_READ_FIRST_RUN_ORDER.md', '.github/workflows/repository-integrity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: repository-review
          create-args: >-
            -c conda-forge
            python=3.12
            plotly
            openpyxl
            numpy
          cache-environment: true
      - name: Compile active sources and verify workflow navigation
        shell: micromamba-shell {0}
        run: |
          python tools/audit_active_repository.py --output audit/active_inventory.json --fail-on-missing-canonical
          python -m unittest tests.verify_active_repository_audit tests.verify_gravity_reactions_3d -v
          python -m unittest discover -s tests -p 'test_project_output_layout_v171.py' -v
          python -m unittest discover -s tests -p 'test_gravity_organized_case_index_v172.py' -v
          python -m unittest discover -s tests -p 'test_gravity_gui_action_layout.py' -v
          python -m unittest discover -s tests -p 'test_main_launcher_workflow_layout.py' -v
          python -m unittest discover -s tests -p 'test_main_launcher_short_alias.py' -v
          python -m unittest discover -s tests -p 'test_model_stage_mesh_area_inventory.py' -v
          python -m unittest discover -s tests -p 'test_model_citation_viewer.py' -v
          python -m unittest discover -s tests -p 'test_import01_audit_and_workflow.py' -v
          python -m unittest discover -s tests -p 'test_esm_organized_export_gui.py' -v
          python -m unittest discover -s tests -p 'test_linear_reaction_vectorization.py' -v
          python -m unittest discover -s tests -p 'test_nbc105_load_case_purpose.py' -v
          python -m unittest discover -s tests -p 'test_history_inspection_scopes.py' -v
          python -m unittest tests.verify_readiness_dashboard -v
          python -m unittest discover -s tests -p 'test_knowledge_map.py' -v
          python -m unittest discover -s tests -p 'test_documentation_coverage.py' -v
          python tools/audit_knowledge_map.py
          python tools/audit_documentation_coverage.py --output audit/documentation_coverage.json --fail-on-missing-component-guides
      - name: Archive static inventory (not engineering validation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-repository-inventory
          path: |
            audit/active_inventory.json
            audit/documentation_coverage.json
          if-no-files-found: warn
