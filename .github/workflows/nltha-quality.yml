name: NLTHA Python quality checks

on:
  push:
    branches: [main]
    paths:
      - 'components/model/readiness_dashboard.py'
      - 'components/model/readiness_dashboard_gui.py'
      - 'components/ui/application.py'
      - 'tests/verify_readiness_dashboard.py'
      - 'components/validation/expanded_workbench_tabs.py'
      - 'components/validation/visual_workbench.py'
      - 'tests/verify_expanded_workbench_tabs.py'
      - 'components/response_spectrum/nbc105_dual_target.py'
      - '34_NBC105_RC_DUAL_C_D_TARGETS.py'
      - 'tests/verify_nbc105_dual_target.py'
      - 'components/response_spectrum/nbc_pair_spectrum_audit.py'
      - '32_NBC105_PAIR_SPECTRUM_AUDIT.py'
      - 'tests/verify_nbc105_pair_spectrum_audit.py'
      - 'components/nonlinear_time_history/seismomatch_audit.py'
      - 'tests/verify_seismomatch_audit.py'
      - 'tools/verify_matched_waveforms.py'
      - 'tests/verify_matched_waveform_register.py'
      - 'tools/verify_original_matched_pairs.py'
      - 'tests/verify_original_matched_pairs.py'
      - 'docs/ground_motions/seismomatch_20261104/**'
      - 'components/nonlinear_time_history/nbc105_horizontal_input.py'
      - '33_NBC105_VERTICAL_APPLICABILITY_REVIEW.py'
      - 'tests/verify_nbc105_horizontal_input.py'
      - 'components/nonlinear_time_history/nbc105_2025_audit.py'
      - 'tests/verify_nbc105_2025_nltha.py'
      - 'components/nonlinear_time_history/thesis_quality.py'
      - 'components/nonlinear_time_history/wall_diagnostics.py'
      - 'components/model/reinforcement_mapping.py'
      - 'components/nonlinear_time_history/wall_topology.py'
      - 'components/nonlinear_time_history/device_recording.py'
      - 'components/nonlinear_time_history/full_record_gate.py'
      - 'components/nonlinear_time_history/variant_comparison.py'
      - 'tests/verify_wall_geometry_preflight.py'
      - 'tests/verify_reinforcement_mapping.py'
      - 'tests/verify_wall_openings.py'
      - 'tests/verify_device_recording.py'
      - 'tests/verify_full_record_gate.py'
      - 'tests/verify_variant_comparison.py'
      - 'components/nonlinear_time_history/building_exploratory.py'
      - '21_NLTHA_TRIAGE.py'
      - 'tests/verify_thesis_nltha_quality.py'
      - '.github/workflows/nltha-quality.yml'
      - 'components/sections/devices.py'
      - 'tests/verify_device_parameter_finiteness.py'
      - 'docs/source/**'
      - 'docs/00_RESEARCH_REFERENCES.md'
      - 'docs/00_THESIS_ACCEPTANCE_GATES.md'
      - 'tests/verify_documentation_coverage.py'
  pull_request:
    paths:
      - 'components/nonlinear_time_history/thesis_quality.py'
      - 'components/nonlinear_time_history/building_exploratory.py'
      - '21_NLTHA_TRIAGE.py'
      - 'tests/verify_thesis_nltha_quality.py'
      - '.github/workflows/nltha-quality.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check key NLTHA files
        run: |
          python -m compileall -q components/nonlinear_time_history 33_NBC105_VERTICAL_APPLICABILITY_REVIEW.py components/response_spectrum/nbc_pair_spectrum_audit.py 32_NBC105_PAIR_SPECTRUM_AUDIT.py components/model/reinforcement_mapping.py components/sections/devices.py components/validation/expanded_workbench_tabs.py components/validation/visual_workbench.py components/model/readiness_dashboard.py components/model/readiness_dashboard_gui.py components/ui/application.py
      - name: Run non-native NLTHA and device quality checks
        run: |
          export PYTHONPATH="$PWD"
          python tests/verify_thesis_nltha_quality.py
          python tests/verify_device_parameter_finiteness.py
          python tests/verify_documentation_coverage.py
          python tests/verify_wall_geometry_preflight.py
          python tests/verify_reinforcement_mapping.py
          python tests/verify_wall_openings.py
          python tests/verify_device_recording.py
          python tests/verify_full_record_gate.py
          python tests/verify_variant_comparison.py
          python tests/verify_nbc105_2025_nltha.py
          python tests/verify_nbc105_horizontal_input.py
          python tests/verify_seismomatch_audit.py
          python tests/verify_matched_waveform_register.py
          python tests/verify_original_matched_pairs.py
          python tests/verify_nbc105_pair_spectrum_audit.py
          python tests/verify_nbc105_dual_target.py
          python tests/verify_expanded_workbench_tabs.py
          python tests/verify_readiness_dashboard.py
