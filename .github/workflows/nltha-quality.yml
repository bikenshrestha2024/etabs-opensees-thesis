  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated CI workbook test dependency
        run: |
          # This is the GitHub Actions runner, not the user's conda-forge Windows environment.
          python -m pip install openpyxl==3.1.5
      - name: Syntax-check key NLTHA files
        run: |
          python -m compileall -q components/validation/etabs_direct_api.py components/validation/etabs_equivalence_report.py components/validation/etabs_comparison.py components/response_spectrum/model_analysis.py components/validation/irregularity_review.py components/validation/floor_end_extraction.py tests/verify_etabs_direct_equivalence.py tests/verify_esm_output_safety.py tests/verify_esm_aw_period_provenance.py components/equivalent_static/calculation_and_gui.py components/inputs/project_workbooks.py components/model/assembly.py components/nonlinear_time_history 36_SOIL_C_NLTHA_RUN_MATRIX.py 35_SOIL_C_NLTHA_PREFLIGHT.py 33_NBC105_VERTICAL_APPLICABILITY_REVIEW.py components/response_spectrum/nbc_pair_spectrum_audit.py 32_NBC105_PAIR_SPECTRUM_AUDIT.py components/model/reinforcement_mapping.py components/sections/devices.py components/validation/expanded_workbench_tabs.py components/validation/visual_workbench.py components/model/readiness_dashboard.py components/model/readiness_dashboard_gui.py components/ui/application.py
      - name: Run non-native NLTHA and device quality checks
        run: |
          export PYTHONPATH="$PWD"
          python tests/verify_thesis_nltha_quality.py
          python tests/verify_device_parameter_finiteness.py
          python tests/verify_documentation_coverage.py
          python tests/verify_active_repository_audit.py
          python tests/verify_review_ledger.py
          python tests/verify_modal_cancel_status.py
          python tests/verify_nbc105_periods.py
          python tests/verify_esm_input_loader.py
          python tests/verify_esm_partial_input.py
          python tests/verify_esm_source_selection.py
          python tests/verify_esm_aw_period_provenance.py
          python tests/verify_esm_blank_copy_rayleigh.py
          python tests/verify_esm_source_state_isolation.py
          python tests/verify_nbc105_torsion_check.py
          python tests/verify_floor_end_extraction.py
          python tests/verify_etabs_floor_end_api.py
          python tests/verify_etabs_direct_equivalence.py
          python tests/verify_audit_repairs_20261105.py
          python tests/verify_mrsm_period_source.py
          python tests/verify_esm_output_safety.py
          python tests/verify_native_wall_probe_preparation.py
          python tests/verify_component_experiment_evidence.py
          python tests/verify_soil_c_case_completion.py
          python tests/verify_rtfc_prompt_contract.py
          python tests/verify_wall_geometry_preflight.py
          python tests/verify_reinforcement_mapping.py
          python tests/verify_wall_openings.py
          python tests/verify_project_wall_material_gate.py
          python tests/verify_device_recording.py
          python tests/verify_full_record_gate.py
          python tests/verify_variant_comparison.py
          python tests/verify_nbc105_2025_nltha.py
          python tests/verify_nbc105_horizontal_input.py
          python tests/verify_seismomatch_audit.py
          python tests/verify_soil_c_nltha_suite.py
          python tests/verify_soil_c_run_matrix.py
          python tests/verify_nltha_ground_acceleration.py
          python tests/verify_matched_records_no_rescale.py
          python tests/verify_matched_waveform_register.py
          python tests/verify_original_matched_pairs.py
          python tests/verify_nbc105_pair_spectrum_audit.py
          python tests/verify_nbc105_dual_target.py
          python tests/verify_expanded_workbench_tabs.py
          python tests/verify_readiness_dashboard.py
